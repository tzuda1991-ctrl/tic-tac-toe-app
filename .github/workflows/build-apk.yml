name: 02 - Build WRTeam Tic-Tac-Toe Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Flutter APK (TicTacToe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21 (Required for Gradle 9.1 / AGP 9.0)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install Flutter SDK (3.47.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Auto-Sync lib/firebase_options.dart from android/app/google-services.json
        run: |
          if [ -f "android/app/google-services.json" ]; then
            echo "Found android/app/google-services.json — syncing lib/firebase_options.dart automatically..."
            API_KEY=$(jq -r '.client[0].api_key[0].current_key' android/app/google-services.json)
            APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' android/app/google-services.json)
            SENDER_ID=$(jq -r '.project_info.project_number' android/app/google-services.json)
            PROJECT_ID=$(jq -r '.project_info.project_id' android/app/google-services.json)
            DB_URL=$(jq -r '.project_info.firebase_url // ("https://" + .project_info.project_id + "-default-rtdb.firebaseio.com")' android/app/google-services.json)
            BUCKET=$(jq -r '.project_info.storage_bucket' android/app/google-services.json)

            cat <<EOF > lib/firebase_options.dart
          // Auto-generated from android/app/google-services.json by GitHub Actions
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                return android;
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  return android;
              }
            }

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '$API_KEY',
              appId: '$APP_ID',
              messagingSenderId: '$SENDER_ID',
              projectId: '$PROJECT_ID',
              databaseURL: '$DB_URL',
              storageBucket: '$BUCKET',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: '$API_KEY',
              appId: '$APP_ID',
              messagingSenderId: '$SENDER_ID',
              projectId: '$PROJECT_ID',
              databaseURL: '$DB_URL',
              storageBucket: '$BUCKET',
              iosBundleId: 'com.tictac.wrteam.TicTacToe',
            );
          }
          EOF
          else
            echo "ERROR: android/app/google-services.json not found!"
            exit 1
          fi

      - name: Auto-Generate Release Keystore & Print SHA-1 / SHA-256 for Firebase
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/upload-keystore.jks" ]; then
            keytool -genkey -v \
              -keystore android/app/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass "tictactoe2026" \
              -keypass "tictactoe2026" \
              -dname "CN=TicTacToe, OU=Mobile, O=WRTeam, L=Mumbai, S=MH, C=IN"
          fi

          cat <<EOF > android/key.properties
          storePassword=tictactoe2026
          keyPassword=tictactoe2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          # Ensure Gradle dependency version checker doesn't block build
          if ! grep -q "skipDependencyChecks=true" android/gradle.properties; then
            echo "" >> android/gradle.properties
            echo "skipDependencyChecks=true" >> android/gradle.properties
          fi

          echo "### Firebase SHA Fingerprints (Copy to Firebase Console -> Project Settings)" >> $GITHUB_STEP_SUMMARY
          echo "Package Name: \`com.tictac.wrteam.TicTacToe\`" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android/app/upload-keystore.jks -alias upload -storepass "tictactoe2026" | grep -E "SHA1:|SHA256:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android/app/upload-keystore.jks -alias upload -storepass "tictactoe2026" | grep -E "SHA1:|SHA256:"

      - name: Fetch Flutter Dependencies
        run: |
          flutter pub get

      - name: Build Android Package
        run: |
          flutter build apk --release

      - name: Upload Compiled APK / AAB to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-apk-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload Generated Keystore (Save this for Play Store updates)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: |
            android/app/upload-keystore.jks
            android/key.properties
          retention-days: 30
