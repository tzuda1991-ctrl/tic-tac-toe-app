name: Build & Sign Flutter Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Flutter APK (TicTacToe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21 (Required for Gradle 9.1 & AGP 9.0.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK (3.47.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Fix Release Startup Crash & Restore Launcher Icon (category.LAUNCHER + Firebase BoM 34.18.0)
        run: |
          # 1. Keep google-services.json consistent across android/app and android/app/src/main
          if [ -f "android/app/google-services.json" ]; then
            cp -f android/app/google-services.json android/app/src/main/google-services.json 2>/dev/null || true
          fi

          # 2. Align MainActivity.kt folder path with package com.tictac.wrteam.TicTacToe
          rm -rf android/app/src/main/kotlin/com/example
          mkdir -p android/app/src/main/kotlin/com/tictac/wrteam/TicTacToe
          cat << 'EOF' > android/app/src/main/kotlin/com/tictac/wrteam/TicTacToe/MainActivity.kt
          package com.tictac.wrteam.TicTacToe

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF

          # 3. Write clean AndroidManifest.xml with android.intent.category.LAUNCHER (Restores App Icon & Open Button!)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="com.android.vending.BILLING"/>

              <application
                  android:label="TicTacToe"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF

          # 4. Upgrade firebase-bom from 33.7.0 to 34.18.0 in android/app/build.gradle (Fixes "TicTacToe keeps stopping" crash)
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id 'com.google.gms.google-services'
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystorePropertiesFile = rootProject.file("key.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.tictac.wrteam.TicTacToe"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8
              }

              defaultConfig {
                  applicationId "com.tictac.wrteam.TicTacToe"
                  minSdkVersion = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  missingDimensionStrategy "platform", "play"
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.release
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:34.18.0"))
          }
          EOF

          # 5. Safe lib/main.dart initialization
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/foundation.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          import 'package:app_tracking_transparency/app_tracking_transparency.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';
          import 'package:unity_ads_plugin/unity_ads_plugin.dart';

          import 'package:tic_tac_toe/firebase_options.dart';
          import 'package:tic_tac_toe/utils/local_storage.dart';
          import 'package:tic_tac_toe/core/constants/ad_config.dart';
          import 'package:tic_tac_toe/core/app.dart';
          import 'package:tic_tac_toe/core/services/sound_service.dart';
          import 'package:tic_tac_toe/core/theme/colors.dart';

          void main(List<String> args) async {
            WidgetsFlutterBinding.ensureInitialized();

            await SystemChrome.setPreferredOrientations(const [
              DeviceOrientation.portraitUp,
            ]);
            SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            SystemChrome.setSystemUIOverlayStyle(
              SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.light,
                systemNavigationBarColor: AppColors.screenBackgroundGradient.last,
                systemNavigationBarIconBrightness: Brightness.light,
                systemNavigationBarDividerColor: Colors.transparent,
              ),
            );

            try {
              await LocalStorage.init();
            } catch (e) {
              debugPrint('LocalStorage init error: $e');
            }

            try {
              await SoundService.init();
            } catch (e) {
              debugPrint('SoundService init error: $e');
            }

            try {
              await Firebase.initializeApp();
            } catch (e) {
              try {
                if (Firebase.apps.isEmpty) {
                  await Firebase.initializeApp(
                    options: DefaultFirebaseOptions.currentPlatform,
                  );
                }
              } catch (e2) {
                debugPrint('Firebase init error: $e2');
              }
            }

            try {
              if (AdConfig.bannerAdEnabled ||
                  AdConfig.interstitialAdEnabled ||
                  AdConfig.rewardedAdEnabled) {
                if (defaultTargetPlatform == TargetPlatform.iOS) {
                  await AppTrackingTransparency.requestTrackingAuthorization();
                }
                if (AdConfig.adProvider == AdProviderType.google) {
                  await MobileAds.instance.initialize();
                } else {
                  await UnityAds.init(
                    gameId: AdConfig.unityGameId,
                    testMode: kDebugMode,
                    onComplete: () => debugPrint('Unity Ads initialized'),
                    onFailed: (error, message) =>
                        debugPrint('Unity Ads init failed: $error $message'),
                  );
                }
              }
            } catch (e) {
              debugPrint('Ads init warning: $e');
            }

            runApp(const App());
          }
          EOF

      - name: Auto-Generate Release Keystore & Print SHA-1 / SHA-256 for Firebase
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/upload-keystore.jks" ]; then
            keytool -genkey -v \
              -keystore android/app/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass "tictactoe2026" \
              -keypass "tictactoe2026" \
              -dname "CN=TicTacToe, OU=Mobile, O=WRTeam, L=Mumbai, S=MH, C=IN"
          fi

          cat <<EOF > android/key.properties
          storePassword=tictactoe2026
          keyPassword=tictactoe2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          if ! grep -q "skipDependencyChecks=true" android/gradle.properties; then
            echo "" >> android/gradle.properties
            echo "skipDependencyChecks=true" >> android/gradle.properties
          fi

          echo "### Firebase Android Certificate Fingerprints (Copy to Firebase Console)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android/app/upload-keystore.jks -alias upload -storepass "tictactoe2026" | grep -E "SHA1:|SHA256:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fetch Flutter Dependencies
        run: flutter pub get

      - name: Build Android Package
        run: flutter build apk --release --no-shrink

      - name: Verify APK Launcher Activity & Icon (aapt)
        run: |
          AAPT_BIN=$(find $ANDROID_HOME/build-tools -name "aapt" | sort -V | tail -n 1)
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          if [ -n "$AAPT_BIN" ] && [ -n "$APK_FILE" ]; then
            echo "### APK Manifest Verification" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            "$AAPT_BIN" dump badging "$APK_FILE" | grep -E "package:|launchable-activity:|application-label:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            "$AAPT_BIN" dump badging "$APK_FILE" | grep "launchable-activity:"
          fi

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-apk-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload Generated Keystore (Keep Safe for Future Updates)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: android/app/upload-keystore.jks
