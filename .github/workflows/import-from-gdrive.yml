name: 01 - Auto Import RAR/ZIP from Google Drive to Git Repo

on:
  workflow_dispatch:
    inputs:
      gdrive_id:
        description: 'Google Drive File ID or Share Link'
        required: true
        default: '1pM-hNExsBy7VvPFBsCGyx-qFrpeVyk9y'
  push:
    paths:
      - '.github/workflows/import-from-gdrive.yml'

permissions:
  contents: write

jobs:
  import-rar-from-gdrive:
    name: Download RAR from GDrive & Push to Git Repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Archive Tools (unar, unrar, 7zip, unzip & gdown)
        run: |
          sudo add-apt-repository multiverse -y || true
          sudo apt-get update
          sudo apt-get install -y unar unrar p7zip-full unzip python3-pip curl file
          pip3 install gdown || pip3 install --break-system-packages gdown || true

      - name: Download Archive from Google Drive (Without --fuzzy)
        env:
          RAW_INPUT: ${{ github.event.inputs.gdrive_id || '1pM-hNExsBy7VvPFBsCGyx-qFrpeVyk9y' }}
        run: |
          mkdir -p /tmp/gdrive_download /tmp/gdrive_extracted
          if echo "$RAW_INPUT" | grep -q "/file/d/"; then
            FILE_ID=$(echo "$RAW_INPUT" | sed -n 's/.*\/file\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
          elif echo "$RAW_INPUT" | grep -q "id="; then
            FILE_ID=$(echo "$RAW_INPUT" | sed -n 's/.*id=\([a-zA-Z0-9_-]*\).*/\1/p')
          else
            FILE_ID="$RAW_INPUT"
          fi

          echo "Resolved Google Drive File ID: $FILE_ID"

          curl -L "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" -o /tmp/gdrive_download/project_archive

          FILE_TYPE=$(file -b /tmp/gdrive_download/project_archive)
          echo "Downloaded file type via curl: $FILE_TYPE"

          if echo "$FILE_TYPE" | grep -iq "HTML"; then
            echo "Fallback to gdown..."
            rm -f /tmp/gdrive_download/project_archive
            gdown "https://drive.google.com/uc?id=${FILE_ID}" -O /tmp/gdrive_download/project_archive
          fi

          ls -lh /tmp/gdrive_download/project_archive

      - name: Extract RAR / ZIP / 7Z Archive
        run: |
          FILE_TYPE=$(file -b /tmp/gdrive_download/project_archive)
          echo "Extracting archive of type: $FILE_TYPE"
          if echo "$FILE_TYPE" | grep -iq "HTML"; then
            echo "ERROR: Google Drive returned an HTML page instead of your RAR file!"
            exit 1
          fi

          unar -f -o /tmp/gdrive_extracted/ /tmp/gdrive_download/project_archive || \
          unrar x -y /tmp/gdrive_download/project_archive /tmp/gdrive_extracted/ || \
          unzip -q -o /tmp/gdrive_download/project_archive -d /tmp/gdrive_extracted/ || \
          7z x -y /tmp/gdrive_download/project_archive -o/tmp/gdrive_extracted/

      - name: Locate Flutter Project (pubspec.yaml) & Clean Android-Only Files
        run: |
          PUBSPEC_PATH=$(find /tmp/gdrive_extracted -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "WARNING: pubspec.yaml not found, copying top-level extracted files..."
            PROJECT_DIR="/tmp/gdrive_extracted"
          else
            PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
            echo "Found Flutter project root at: $PROJECT_DIR"
          fi

          # Delete ios/ and build/ folders
          rm -rf "$PROJECT_DIR/ios"
          rm -rf "$PROJECT_DIR/build" "$PROJECT_DIR/.dart_tool" "$PROJECT_DIR/android/.gradle"
          rm -rf "$PROJECT_DIR/__MACOSX"

          # CRITICAL: Remove RAR's internal .git folder so it doesn't overwrite our repo's credentials
          rm -rf "$PROJECT_DIR/.git" "$PROJECT_DIR/.github"

          # Copy all project files into the Git repository root
          cp -rT "$PROJECT_DIR" "$GITHUB_WORKSPACE/"

      - name: Add Android-Optimized .gitignore
        run: |
          cat << 'EOF' > .gitignore
          .dart_tool/
          .flutter-plugins
          .flutter-plugins-dependencies
          .packages
          .pub-cache/
          .pub/
          /build/
          /ios/
          /android/.gradle/
          /android/captures/
          /android/local.properties
          node_modules/
          EOF

      - name: Commit & Push Extracted Project to GitHub Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "chore: auto-import WRTeam Tic-Tac-Toe Android project from Google Drive"
            git push origin HEAD:${{ github.ref_name }} --force
            echo "### Successfully Imported RAR from Google Drive!" >> $GITHUB_STEP_SUMMARY
            echo "All Flutter Android files are now in your GitHub repository." >> $GITHUB_STEP_SUMMARY
          fi
