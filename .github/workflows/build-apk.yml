name: Build & Sign Flutter Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Flutter APK (TicTacToe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21 (Required for Gradle 9.1 & AGP 9.0.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK (3.47.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Fix Release Startup Crash (Firebase BoM 34.18.0, AndroidManifest & Crash Catcher)
        run: |
          # 1. Sync lib/firebase_options.dart from android/app/google-services.json
          if [ -f "android/app/google-services.json" ]; then
            cp -f android/app/google-services.json android/app/src/main/google-services.json 2>/dev/null || true
            API_KEY=$(jq -r '.client[0].api_key[0].current_key' android/app/google-services.json)
            APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' android/app/google-services.json)
            SENDER_ID=$(jq -r '.project_info.project_number' android/app/google-services.json)
            PROJECT_ID=$(jq -r '.project_info.project_id' android/app/google-services.json)
            DB_URL=$(jq -r '.project_info.firebase_url // ("https://" + .project_info.project_id + "-default-rtdb.firebaseio.com")' android/app/google-services.json)
            BUCKET=$(jq -r '.project_info.storage_bucket' android/app/google-services.json)

            cat <<EOF > lib/firebase_options.dart
          // Auto-generated from android/app/google-services.json
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                return android;
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  return android;
              }
            }

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '$API_KEY',
              appId: '$APP_ID',
              messagingSenderId: '$SENDER_ID',
              projectId: '$PROJECT_ID',
              databaseURL: '$DB_URL',
              storageBucket: '$BUCKET',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: '$API_KEY',
              appId: '$APP_ID',
              messagingSenderId: '$SENDER_ID',
              projectId: '$PROJECT_ID',
              databaseURL: '$DB_URL',
              storageBucket: '$BUCKET',
              iosBundleId: 'com.tictac.wrteam.TicTacToe',
            );
          }
          EOF
          fi

          # 2. Write clean AndroidManifest.xml with INTERNET permission & On-Screen Crash Catcher
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="com.android.vending.BILLING"/>

              <application
                  android:label="TicTacToe"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <provider
                      android:name=".CrashCatcherProvider"
                      android:authorities="${applicationId}.crashcatcher"
                      android:exported="false"
                      android:initOrder="999999999" />

                  <activity
                      android:name=".CrashViewerActivity"
                      android:exported="false"
                      android:process=":crash_viewer"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.action.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF

          # 3. CRITICAL FIX: Upgrade firebase-bom from 33.7.0 to 34.18.0 & remove conflicting datastore 1.2.0 constraints
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id 'com.google.gms.google-services'
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystorePropertiesFile = rootProject.file("key.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.tictac.wrteam.TicTacToe"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/java'
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.tictac.wrteam.TicTacToe"
                  minSdkVersion = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  missingDimensionStrategy "platform", "play"
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.release
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:34.18.0"))
          }
          EOF

          # 4. Create MainActivity.java + On-Screen CrashCatcherProvider & CrashViewerActivity
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/java/com/tictac/wrteam/TicTacToe
          cat << 'EOF' > android/app/src/main/java/com/tictac/wrteam/TicTacToe/MainActivity.java
          package com.tictac.wrteam.TicTacToe;

          import io.flutter.embedding.android.FlutterActivity;

          public class MainActivity extends FlutterActivity {
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/tictac/wrteam/TicTacToe/CrashCatcherProvider.java
          package com.tictac.wrteam.TicTacToe;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import java.io.PrintWriter;
          import java.io.StringWriter;

          public class CrashCatcherProvider extends ContentProvider {
              @Override
              public boolean onCreate() {
                  final Context context = getContext();
                  final Thread.UncaughtExceptionHandler defaultHandler = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                      @Override
                      public void uncaughtException(Thread thread, Throwable throwable) {
                          try {
                              StringWriter sw = new StringWriter();
                              PrintWriter pw = new PrintWriter(sw);
                              throwable.printStackTrace(pw);
                              String stackTrace = sw.toString();

                              if (context != null) {
                                  Intent intent = new Intent(context, CrashViewerActivity.class);
                                  intent.putExtra("stack_trace", stackTrace);
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                                  context.startActivity(intent);
                                  android.os.Process.killProcess(android.os.Process.myPid());
                                  System.exit(10);
                                  return;
                              }
                          } catch (Throwable ignored) {
                          }
                          if (defaultHandler != null) {
                              defaultHandler.uncaughtException(thread, throwable);
                          }
                      }
                  });
                  return true;
              }

              @Override
              public Cursor query(Uri u, String[] p, String s, String[] sa, String so) { return null; }
              @Override
              public String getType(Uri u) { return null; }
              @Override
              public Uri insert(Uri u, ContentValues v) { return null; }
              @Override
              public int delete(Uri u, String s, String[] sa) { return 0; }
              @Override
              public int update(Uri u, ContentValues v, String s, String[] sa) { return 0; }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/tictac/wrteam/TicTacToe/CrashViewerActivity.java
          package com.tictac.wrteam.TicTacToe;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class CrashViewerActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  final String trace = getIntent().getStringExtra("stack_trace");
                  final String displayTrace = trace != null ? trace : "Unknown startup error";

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#0F172A"));
                  root.setPadding(32, 64, 32, 32);

                  TextView title = new TextView(this);
                  title.setText("Startup Crash Diagnostic Log");
                  title.setTextColor(Color.parseColor("#F87171"));
                  title.setTextSize(18f);
                  root.addView(title);

                  Button copyBtn = new Button(this);
                  copyBtn.setText("Copy Error Log");
                  copyBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null) {
                              cm.setPrimaryClip(ClipData.newPlainText("CrashLog", displayTrace));
                              Toast.makeText(CrashViewerActivity.this, "Copied Crash Log!", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
                  root.addView(copyBtn);

                  ScrollView scroll = new ScrollView(this);
                  TextView logView = new TextView(this);
                  logView.setText(displayTrace);
                  logView.setTextColor(Color.WHITE);
                  logView.setTextSize(12f);
                  logView.setPadding(0, 24, 0, 24);
                  scroll.addView(logView);
                  root.addView(scroll);

                  setContentView(root);
              }
          }
          EOF

          # 5. Safe lib/main.dart initialization
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/foundation.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          import 'package:app_tracking_transparency/app_tracking_transparency.dart';
          import 'package:firebase_app_check/firebase_app_check.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';
          import 'package:unity_ads_plugin/unity_ads_plugin.dart';

          import 'package:tic_tac_toe/firebase_options.dart';
          import 'package:tic_tac_toe/utils/local_storage.dart';
          import 'package:tic_tac_toe/core/constants/ad_config.dart';
          import 'package:tic_tac_toe/core/app.dart';
          import 'package:tic_tac_toe/core/services/sound_service.dart';
          import 'package:tic_tac_toe/core/theme/colors.dart';

          void main(List<String> args) async {
            WidgetsFlutterBinding.ensureInitialized();

            await SystemChrome.setPreferredOrientations(const [
              DeviceOrientation.portraitUp,
            ]);
            SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            SystemChrome.setSystemUIOverlayStyle(
              SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.light,
                systemNavigationBarColor: AppColors.screenBackgroundGradient.last,
                systemNavigationBarIconBrightness: Brightness.light,
                systemNavigationBarDividerColor: Colors.transparent,
              ),
            );

            try {
              await LocalStorage.init();
            } catch (e) {
              debugPrint('LocalStorage init error: $e');
            }

            try {
              await SoundService.init();
            } catch (e) {
              debugPrint('SoundService init error: $e');
            }

            try {
              if (Firebase.apps.isEmpty) {
                await Firebase.initializeApp(
                  options: DefaultFirebaseOptions.currentPlatform,
                );
              }
              await FirebaseAppCheck.instance.activate(
                providerAndroid:
                    kDebugMode ? AndroidDebugProvider() : AndroidPlayIntegrityProvider(),
                providerApple:
                    kDebugMode ? AppleDebugProvider() : AppleAppAttestProvider(),
              );
            } catch (e) {
              debugPrint('Firebase/AppCheck init warning: $e');
            }

            try {
              if (AdConfig.bannerAdEnabled ||
                  AdConfig.interstitialAdEnabled ||
                  AdConfig.rewardedAdEnabled) {
                if (defaultTargetPlatform == TargetPlatform.iOS) {
                  await AppTrackingTransparency.requestTrackingAuthorization();
                }
                if (AdConfig.adProvider == AdProviderType.google) {
                  await MobileAds.instance.initialize();
                } else {
                  await UnityAds.init(
                    gameId: AdConfig.unityGameId,
                    testMode: kDebugMode,
                    onComplete: () => debugPrint('Unity Ads initialized'),
                    onFailed: (error, message) =>
                        debugPrint('Unity Ads init failed: $error $message'),
                  );
                }
              }
            } catch (e) {
              debugPrint('Ads init warning: $e');
            }

            runApp(const App());
          }
          EOF

      - name: Auto-Generate Release Keystore & Print SHA-1 / SHA-256 for Firebase
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/upload-keystore.jks" ]; then
            keytool -genkey -v \
              -keystore android/app/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass "tictactoe2026" \
              -keypass "tictactoe2026" \
              -dname "CN=TicTacToe, OU=Mobile, O=WRTeam, L=Mumbai, S=MH, C=IN"
          fi

          cat <<EOF > android/key.properties
          storePassword=tictactoe2026
          keyPassword=tictactoe2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          if ! grep -q "skipDependencyChecks=true" android/gradle.properties; then
            echo "" >> android/gradle.properties
            echo "skipDependencyChecks=true" >> android/gradle.properties
          fi

          echo "### Firebase Android Certificate Fingerprints (Copy to Firebase Console)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android/app/upload-keystore.jks -alias upload -storepass "tictactoe2026" | grep -E "SHA1:|SHA256:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fetch Flutter Dependencies
        run: flutter pub get

      - name: Build Android Package
        run: flutter build apk --release --no-shrink

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tictactoe-apk-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload Generated Keystore (Keep Safe for Future Updates)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: android/app/upload-keystore.jks
